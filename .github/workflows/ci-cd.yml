name: CI & Deploy

on:
  push:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run backend tests
        working-directory: ./banking-system-server
        run: ./mvnw test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: banking-system-client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./banking-system-client
        run: pnpm install --ignore-scripts

      - name: Build frontend
        working-directory: ./banking-system-client
        run: pnpm build

  deploy:
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Trigger Render frontend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
